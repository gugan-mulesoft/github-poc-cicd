name: Publish and Deploy Pipeline

on:
  push:
    branches:
      - dev
      - feature/*

env:
  JAVA_VERSION: '17'
  MAVEN_DISTRO: 'zulu'

jobs:
  Publish_to_Exchange:
    runs-on: ubuntu-latest
    env:
      ENV_SUFFIX: ${{ github.ref_name == 'feature/*' && '-dev' || github.ref_name == 'master' && '-prod' || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Increment Version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. -v OFS=. '{$NF += 1 ; print}')
          echo "New version: $NEW_VERSION"
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and Push Version Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          git checkout $BRANCH_NAME
          git pull origin $BRANCH_NAME
          git commit -am "chore: bump version to $NEW_VERSION"
          git push origin $BRANCH_NAME

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.MAVEN_DISTRO }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Publish to Exchange with ENV_SUFFIX
        shell: bash
        run: |
          cp pom.xml pom.xml.original
          sed -i "s|<artifactId>github-poc-cicd</artifactId>|<artifactId>github-poc-cicd${ENV_SUFFIX}</artifactId>|" pom.xml
          
          mvn clean deploy --settings .maven/settings.xml -DskipMunitTests \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}"

          mv pom.xml.original pom.xml

  Deploying_to_Development:
    needs: Publish_to_Exchange
    if: github.ref_name == 'feature/*'
    runs-on: ubuntu-latest
    environment: dev
    env:
      ENV_SUFFIX: -dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull Latest from dev
        run: |
          git fetch origin
          git checkout dev
          git pull origin dev

      - name: Show version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Version for deploy: $VERSION"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.MAVEN_DISTRO }}

      - name: Build and Deploy to CloudHub 2.0
        shell: bash
        run: |
          cp pom.xml pom.xml.original
          sed -i "s|<artifactId>github-poc-cicd</artifactId>|<artifactId>github-poc-cicd${ENV_SUFFIX}</artifactId>|" pom.xml

          mvn clean deploy --settings .maven/settings.xml -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="dev" \
            -Dtarget="Cloudhub-US-East-2" \
            -Denv="dev" \
            -DappName="github-poc-cicd${ENV_SUFFIX}"

          mv pom.xml.original pom.xml
