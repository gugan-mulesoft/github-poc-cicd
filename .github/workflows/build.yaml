name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches:
      - dev
      - uat
      - main

env:
  MAVEN_SETTINGS: .maven/settings.xml
  REGION: Cloudhub-US-East-2

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      CLIENT_ID: ${{ steps.set-vars.outputs.CLIENT_ID }}
      CLIENT_SECRET: ${{ steps.set-vars.outputs.CLIENT_SECRET }}
      ENV: ${{ steps.set-vars.outputs.ENV }}
      ASSET_NAME: ${{ steps.set-vars.outputs.ASSET_NAME }}
    steps:
      - id: set-vars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "CLIENT_ID=${{ secrets.DEV_CLIENT_ID }}" >> $GITHUB_OUTPUT
            echo "CLIENT_SECRET=${{ secrets.DEV_CLIENT_SECRET }}" >> $GITHUB_OUTPUT
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "ASSET_NAME=github-cicd-demo-dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            echo "CLIENT_ID=${{ secrets.UAT_CLIENT_ID }}" >> $GITHUB_OUTPUT
            echo "CLIENT_SECRET=${{ secrets.UAT_CLIENT_SECRET }}" >> $GITHUB_OUTPUT
            echo "ENV=uat" >> $GITHUB_OUTPUT
            echo "ASSET_NAME=github-cicd-demo-uat" >> $GITHUB_OUTPUT
          fi

  build-and-publish:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Publish to Exchange
        run: |
          mvn deploy --settings ${{ env.MAVEN_SETTINGS }} -DskipMunitTests \
            -Dclient.id="${{ needs.setup.outputs.CLIENT_ID }}" \
            -Dclient.secret="${{ needs.setup.outputs.CLIENT_SECRET }}" \
            -DcloudhubEnvironment="${{ needs.setup.outputs.ENV }}" \
            -Dtarget="${{ env.REGION }}" \
            -Denv="${{ needs.setup.outputs.ENV }}" \
            -Dasset.name="${{ needs.setup.outputs.ASSET_NAME }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-publish]
    if: github.ref_name == 'dev' || github.ref_name == 'uat'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Deploy to CloudHub 2.0
        run: |
          mvn mule:deploy --settings ${{ env.MAVEN_SETTINGS }} -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ needs.setup.outputs.CLIENT_ID }}" \
            -Dclient.secret="${{ needs.setup.outputs.CLIENT_SECRET }}" \
            -DcloudhubEnvironment="${{ needs.setup.outputs.ENV }}" \
            -Dtarget="${{ env.REGION }}" \
            -Denv="${{ needs.setup.outputs.ENV }}" \
            -Dasset.name="${{ needs.setup.outputs.ASSET_NAME }}"
