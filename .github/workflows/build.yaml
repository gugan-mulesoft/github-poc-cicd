name: Publish to Exchange & Deploy to CloudHub 2.0 (Dev & UAT)

on:
  push:
    branches: 
      - dev
      - uat
      - main
      - feature/*
jobs:
  publish-to-exchange:
    name: Publish to Exchange
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Increment Version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. -v OFS=. '{$NF += 1 ; print}')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "New version: $NEW_VERSION"
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false

      - name: Commit and Push New Version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Increment POM version to ${{ env.NEW_VERSION }} [skip ci]"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Verify Maven Installation
        run: mvn -version

      - name: Build Project
        run: mvn clean install -DskipTests

      - name: Publish to Anypoint Exchange
        run: |
          mvn deploy --settings .maven/settings.xml -DskipMunitTests \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="dev" \
            -Dtarget="Cloudhub-US-East-2" \
            -Denv="dev"

  deploy-to-cloudhub-dev:
    needs: publish-to-exchange
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev') || 
        (github.event_name == 'push' && (github.ref == 'refs/heads/dev'))
 
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Pull the latest changes from dev branch
        run: |
          git fetch origin
          git checkout dev
          git pull origin dev
 
      - name: Echo version from pom.xml
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Using version $VERSION"    
      - name: Build and Deploy to DEV
        shell: bash
        run: |
          mvn clean deploy --settings .maven/settings.xml -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="DEV" \
            -Dtarget="Cloudhub-US-East-2" \
            -Denv="dev" 
