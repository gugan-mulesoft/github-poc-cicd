name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches: 
      - dev
      - uat
      - main
      - feature/*

jobs:         
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Increment Version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. -v OFS=. '{$NF += 1 ; print}')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "New version: $NEW_VERSION"
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Increment POM version to ${{ env.NEW_VERSION }} [skip ci]"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Determine Environment
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "dev" || "${{ github.ref_name }}" == feature/* ]]; then
            echo "ENV_SUFFIX=-dev" >> $GITHUB_ENV
            echo "CLOUDHUB_ENV=dev" >> $GITHUB_ENV
            echo "CLIENT_ID=${{ secrets.DEV_CLIENT_ID }}" >> $GITHUB_ENV
            echo "CLIENT_SECRET=${{ secrets.DEV_CLIENT_SECRET }}" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" == "uat" ]; then
            echo "ENV_SUFFIX=-uat" >> $GITHUB_ENV
            echo "CLOUDHUB_ENV=uat" >> $GITHUB_ENV
            echo "CLIENT_ID=${{ secrets.UAT_CLIENT_ID }}" >> $GITHUB_ENV
            echo "CLIENT_SECRET=${{ secrets.UAT_CLIENT_SECRET }}" >> $GITHUB_ENV
          else
            echo "ENV_SUFFIX=-prod" >> $GITHUB_ENV
            echo "CLOUDHUB_ENV=prod" >> $GITHUB_ENV
            echo "CLIENT_ID=${{ secrets.PROD_CLIENT_ID }}" >> $GITHUB_ENV
            echo "CLIENT_SECRET=${{ secrets.PROD_CLIENT_SECRET }}" >> $GITHUB_ENV
          fi
          echo "Using environment suffix: $ENV_SUFFIX"

      - name: Publish to Exchange
        shell: bash
        run: |
          # Create temporary pom.xml with environment suffix
          cp pom.xml pom.xml.temp
          sed -i "s/<artifactId>github-poc-cicd<\/artifactId>/<artifactId>github-poc-cicd$ENV_SUFFIX<\/artifactId>/" pom.xml.temp
          
          # Publish to Exchange with modified pom
          mvn -f pom.xml.temp deploy --settings .maven/settings.xml -DskipTests -DskipMunitTests \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="$CLOUDHUB_ENV" \
            -Dtarget="Cloudhub-US-East-2" \
            -Denv="$CLOUDHUB_ENV"

      - name: Deploy to CloudHub 2.0
        shell: bash
        run: |
          mvn deploy --settings .maven/settings.xml -DskipTests -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="$CLOUDHUB_ENV" \
            -Dtarget="Cloudhub-US-East-2" \
            -Denv="$CLOUDHUB_ENV" \
            -Dexchange.assetId="github-poc-cicd$ENV_SUFFIX" \
            -Dexchange.version="$NEW_VERSION"
