name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches:
      - dev
      - uat
      - main

env:
  MAVEN_SETTINGS: .maven/settings.xml
  MAVEN_REPO_CACHE: ~/.m2/repository
  REGION: Cloudhub-US-East-2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.MAVEN_REPO_CACHE }}
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

  publish_to_exchange:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set Environment Variables
        id: envvars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "CLIENT_ID=${{ secrets.DEV_CLIENT_ID }}" >> $GITHUB_ENV
            echo "CLIENT_SECRET=${{ secrets.DEV_CLIENT_SECRET }}" >> $GITHUB_ENV
            echo "ENV=dev" >> $GITHUB_ENV
            echo "VERSION_SUFFIX=-dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            echo "CLIENT_ID=${{ secrets.UAT_CLIENT_ID }}" >> $GITHUB_ENV
            echo "CLIENT_SECRET=${{ secrets.UAT_CLIENT_SECRET }}" >> $GITHUB_ENV
            echo "ENV=uat" >> $GITHUB_ENV
            echo "VERSION_SUFFIX=-uat" >> $GITHUB_ENV
          fi

      - name: Set Unique Version
        run: |
          # Read current version from pom.xml and append environment-specific suffix
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          NEW_VERSION="${VERSION}${VERSION_SUFFIX}"
          echo "Setting version to: $NEW_VERSION"
          mvn versions:set -DnewVersion=$NEW_VERSION
          echo "PUBLISHED_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Publish to Exchange (${{ env.ENV }})
        run: |
          mvn deploy --settings ${{ env.MAVEN_SETTINGS }} -DskipMunitTests \
            -Dclient.id="${{ env.CLIENT_ID }}" \
            -Dclient.secret="${{ env.CLIENT_SECRET }}" \
            -DcloudhubEnvironment="${{ env.ENV }}" \
            -Dtarget="${{ env.REGION }}" \
            -Denv="${{ env.ENV }}"

  deploy_to_cloudhub:
    runs-on: ubuntu-latest
    needs: publish_to_exchange
    if: github.ref_name == 'dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Deploy to CloudHub 2.0 (Dev)
        run: |
          mvn mule:deploy --settings ${{ env.MAVEN_SETTINGS }} -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="dev" \
            -Dtarget="${{ env.REGION }}" \
            -Denv="dev"

  deploy_to_uat:
    runs-on: ubuntu-latest
    needs: publish_to_exchange
    if: github.ref_name == 'uat'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Deploy to CloudHub 2.0 (UAT)
        run: |
          mvn mule:deploy --settings ${{ env.MAVEN_SETTINGS }} -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.UAT_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.UAT_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="uat" \
            -Dtarget="${{ env.REGION }}" \
            -Denv="uat"
