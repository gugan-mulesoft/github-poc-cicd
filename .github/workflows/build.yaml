name: Deploy to CloudHub 2.0 (Dev & UAT)

on:
  push:
    branches: 
      - dev
      - uat
      - main

jobs:
  deploy-to-cloudhub-dev:
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev') || 
        (github.event_name == 'push' && (github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Pull the latest changes from dev branch
        run: |
          git fetch origin
          git checkout dev
          git pull origin dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Echo version from pom.xml
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Using version $VERSION"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and Deploy to DEV
        shell: bash
        run: |
          mvn clean deploy --settings .maven/settings.xml -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.DEV_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.DEV_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="dev" \
            -Dtarget="Cloudhub-US-East-2" \
            -Denv="dev"

  deploy-to-cloudhub-uat:
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'uat') ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/uat'))
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Pull the latest changes from uat branch
        run: |
          git fetch origin
          git checkout uat
          git pull origin uat

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Echo version from pom.xml
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Using version $VERSION"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and Deploy to UAT
        shell: bash
        run: |
          mvn clean deploy --settings .maven/settings.xml -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.UAT_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.UAT_CLIENT_SECRET }}" \
            -DcloudhubEnvironment="uat" \
            -Dtarget="Cloudhub-US-East-2" \
            -Denv="uat"
